# PoE Tracker settings.
# Edit this file (in your data folder, see README), then restart the app.

# Full path to Path of Exile's Client.txt. Leave empty to auto-detect
# (Steam libraries and the standalone install are searched).
log_path: ""

# Time zone your PC (and therefore Client.txt) uses. Also used for "days".
timezone: America/Chicago

# Character to assume when the log has not named one yet in a login.
current_character: RagsToRage

# League to show by default in the dashboard ("" = the newest league).
current_league: Curse of the Allflame

# Where the dashboard opens: "native" (its own window) or "browser".
window: native

# Dashboard address. Only reachable from this PC.
host: 127.0.0.1
port: 8765
open_browser: true

# Watch the clipboard for copied maps (Ctrl+C on a map in game).
clipboard_capture: true

# A copied map is linked to the next map you open within this many minutes.
capture_link_minutes: 10

# League start mode: during a new league's campaign only the Campaign page is
# shown (with Overview and Standard), then Mapping until all four Voidstones.
league_start_mode: true

# League start ends at your fourth Voidstone or this many days after the league
# launched, whichever comes first. After that the League Start pages stop counting.
league_start_days: 14

# Look of the dashboard: exile (Path of Exile style) or classic.
theme: exile
# Check github.com/deweesa1/poe-tracker for a newer version every 30 minutes.
update_check: true
update_repo: https://github.com/deweesa1/poe-tracker.git

# Mini tracker (always-on-top window).
mini_on_start: false        # open it whenever the tracker starts
mini_click_through: false   # true: clicks on the locked mini tracker go to the game underneath
mini_hotkey: ctrl+alt+m     # lock/unlock; change it in Settings
mini_opacity: 0.92          # 0.4 (very see-through) to 1.0 (solid)

# Profile snapshots: your account name (Name#1234) for reading gear, jewels and
# the passive tree from your public pathofexile.com profile.
poe_account: ""
profile_snapshots: true     # take them automatically during league start
