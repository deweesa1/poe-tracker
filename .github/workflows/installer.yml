name: Build installer

# Push a tag like v0.2.0 to build PoE-Tracker-Setup.exe and publish it as a
# GitHub release. "Run workflow" on the Actions tab builds one without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for the installer"
        default: "0.0.0-test"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "${{ inputs.version }}" }
          ./installer/build.ps1 -Version $v -Commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: PoE-Tracker-Setup
          path: dist/*.exe
      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/PoE-Tracker-Setup.exe `
            --title "PoE Tracker ${{ github.ref_name }}" `
            --notes "Download **PoE-Tracker-Setup.exe** below and run it. Installs for your user only (no admin needed); your data in %LOCALAPPDATA%\PoETracker is kept. After this, the tracker updates itself."
