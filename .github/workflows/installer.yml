name: Build installer

# Builds PoE-Tracker-Setup.exe. Publishes it as a GitHub release when a tag like
# v0.2.0 is pushed, or when "Run workflow" (Actions tab) is used with "publish"
# ticked (that creates the tag too).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for the installer (e.g. 0.2.0)"
        default: "0.0.0-test"
      publish:
        description: "Publish it as release v<version>"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # keep files byte-for-byte as in the repo (no CRLF), so the app's update
      # check sees them as identical to GitHub's
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "${{ inputs.version }}" }
          ./installer/build.ps1 -Version $v -Commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: PoE-Tracker-Setup
          path: dist/*.exe
      - name: Publish release
        if: github.ref_type == 'tag' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v${{ inputs.version }}" }
          gh release create $tag dist/PoE-Tracker-Setup.exe --target "${{ github.sha }}" `
            --title "PoE Tracker $tag" `
            --notes "Download **PoE-Tracker-Setup.exe** below and run it. Installs for your user only (no admin needed); your data in %LOCALAPPDATA%\PoETracker is kept. After this, the tracker updates itself."
